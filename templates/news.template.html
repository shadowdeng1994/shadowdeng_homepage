<!DOCTYPE html>
<html lang="en" class="lang-en" data-title-en="{{NAME_EN}} · News" data-title-zh="{{NAME_ZH}} · News">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME_EN}} · News</title>
  <link rel="stylesheet" href="style.css?v={{ASSET_V}}">
  <link rel="icon" type="image/svg+xml" href="logo.svg?v={{ASSET_V}}">
  <script>(function(){try{var l=localStorage.getItem('lang');if(l!=='zh'&&l!=='en')l='en';var d=document.documentElement;d.className='lang-'+l;d.setAttribute('lang',l==='zh'?'zh-CN':'en');var t=d.getAttribute('data-title-'+l);if(t){document.title=t;}}catch(e){}})();</script>
  <script src="main.js?v={{ASSET_V}}" defer></script>
</head>
<body class="page-list">

<div class="bg-far"></div>
<div class="bg-near"></div>

<header class="topbar">
  <div class="nav-inner">
    <a class="nav-name" href="index.html"><img class="nav-logo" src="logo.svg?v={{ASSET_V}}" alt=""><span class="lang-en">{{NAME_EN}}</span><span class="lang-zh">{{NAME_ZH}}</span></a>
    <div class="nav-links">
      <a href="index.html#about"    data-nav="about"><span class="lang-en">About</span><span class="lang-zh">简介</span></a>
      <a href="index.html#research" data-nav="research"><span class="lang-en">Research</span><span class="lang-zh">研究</span></a>
      <a href="index.html#papers"   data-nav="papers">Publication</a>
      <a href="index.html#news" class="active" data-nav="news">News</a>
    </div>
    <button class="lang-toggle" type="button">中文</button>
  </div>
</header>

<main class="home">
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">News</h2>
      <p class="section-subtitle">ALL</p>
    </div>
    <ul class="news-list">
{{NEWS}}
    </ul>
  </section>
</main>

<footer><span class="lang-en">Last updated · {{UPDATED_AT}}</span><span class="lang-zh">最近更新 · {{UPDATED_AT}}</span></footer>

</body>
</html>

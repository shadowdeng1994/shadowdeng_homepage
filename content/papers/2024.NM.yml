title: A statistical method for quantifying progenitor cells reveals incipient cell fate commitments
authors:
  - '**Shanjun Deng**'
  - Han Gong
  - Di Zhang
  - Mengdong Zhang
  - Xionglei He
date: 2024-04
venue: '*Nature Methods*'
corresponding:
  - Xionglei He
co_first:
  - Shanjun Deng
  - Han Gong
abstract: |
  本文提出无需祖细胞特异标志物的统计方法 TarCA，通过细胞系统发育树计算同一组织内两随机
  细胞的溯祖概率来估计祖细胞数目，并在线虫、果蝇和小鼠数据中得到验证，进而识别出小鼠胚胎
  发育中的谱系特异上调基因与早期细胞命运决定。
tags:
  - progenitor quantification
  - cell phylogeny
  - coalescent analysis

title: Achieving single-cell-resolution lineage tracing in zebrafish by continuous barcoding mutations during embryogenesis
authors:
  - Zhan Liu
  - Hui Zeng
  - Huimin Xiang
  - '**Shanjun Deng**'
  - Xionglei He
date: 2024-09
venue: '*Journal of Genetics and Genomics*'
corresponding:
  - Xionglei He
abstract: |
  本文将 SMALT 系统应用于斑马鱼，在受精后一天胚胎的 1 kb 条形码上平均记录 14 个替换突变，
  重建出内部节点达数百个、自举支持率中位数为 99% 的细胞谱系树，揭示再生鳍细胞主要来自
  同一部位，并证实生殖细胞库的稳定性及其与体细胞谱系的早期分离。
tags:
  - lineage tracing
  - zebrafish
  - cell phylogeny

title: Mutation signatures inform the natural host of SARS-CoV-2
authors:
  - '**Shanjun Deng**'
  - Ke Xing
  - Xionglei He
date: 2022-02-23
venue: '*National Science Review*'
corresponding:
  - Xionglei He
co_first:
  - Shanjun Deng
  - Ke Xing
abstract: |
  通过比较 SARS-CoV-2 与六种近缘冠状病毒的突变谱，发现疫情前分支的突变谱与蝙蝠宿主分支
  （如 RaTG13）近乎一致（i-score 99.9%），而与疫情后的人群分支明显不同，提示其自然宿主
  为蝙蝠，且该病毒不太可能为人工合成。
tags:
  - SARS-CoV-2
  - mutation signatures
  - viral evolution

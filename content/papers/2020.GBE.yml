title: Drivers of Mating Type Composition in *Tetrahymena thermophila*
authors:
  - Guangying Wang
  - Kai Chen
  - Jing Zhang
  - '**Shanjun Deng**'
  - Jie Xiong
  - Xionglei He
  - Yunxin Fu
  - Wei Miao
date: 2020-12-06
venue: '*Genome Biology and Evolution*'
corresponding:
  - Yunxin Fu
  - Wei Miao
abstract: |
  本文通过种群遗传学模型与演化实验，揭示四膜虫（Tetrahymena thermophila）七种交配型的
  组成动态主要取决于有性/无性细胞存活率之比与自然选择强度，实验群体中携带新发有益突变的
  交配型受强选择驱动而趋于固定。
tags:
  - population genetics
  - ciliate
  - mating type
  - experimental evolution

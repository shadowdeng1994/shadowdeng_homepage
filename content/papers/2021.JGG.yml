title: An instantaneous coalescent method insensitive to population structure
authors:
  - Zeqi Yao
  - Kehui Liu
  - '**Shanjun Deng**'
  - Xionglei He
date: 2021-03
venue: '*Journal of Genetics and Genomics*'
corresponding:
  - Xionglei He
co_first:
  - Zeqi Yao
  - Kehui Liu
abstract: |
  本文提出对群体结构不敏感的 i-coalescent（瞬时溯祖）方法，证明相邻上一代的溯祖概率
  与群体结构无关，并可基于取样等位的系统发育树准确重建高度结构化群体的有效群体大小动态。
tags:
  - coalescent
  - population structure
  - demographic inference

abstract: |
  该文以小鼠肝脏为体内模型评估长期 CRISPR/Cas9 基因编辑的安全性，发现除脱靶效应外，
  长期 SaCas9 编辑还会引发宿主免疫反应，并在 DNA 损伤应答相关基因中产生克隆突变。
abstract_en: |
  Using the mouse liver as an in vivo model, this letter evaluates the long-term safety
  of CRISPR/Cas9 genome editing and shows that, beyond off-target effects, prolonged
  SaCas9 editing also triggers host immune responses and accumulates clonal mutations in
  DNA damage response genes.

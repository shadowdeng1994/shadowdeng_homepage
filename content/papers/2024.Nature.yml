abstract: |
  解析癌前病变的起源与演化对于有效预防恶性转化至关重要，但现有认知仍然有限。
  本研究利用基于碱基编辑器的 DNA 条形码系统，在炎症或 Apc 基因缺失诱导的小鼠
  肠肿瘤模型中系统绘制单细胞系统发育树。通过对来自正常、炎症及肿瘤肠组织、
  包含 260,922 个单细胞的高分辨率系统发育树进行定量分析，我们在每个病灶中鉴定出
  数十个独立细胞谱系并行的克隆扩增；并通过 bulk 全外显子测序与单腺体全基因组测序，
  发现人类散发性结直肠息肉同样具有多克隆起源。基因组与临床数据支持“多克隆向单克隆
  转变”的模型，其中单克隆病灶代表更晚期的阶段。单细胞 RNA 测序显示早期多克隆病灶存在
  广泛的细胞间互作，而在单克隆转变过程中这些互作显著减少。研究表明结直肠癌前病变常由
  多个不同谱系共同奠基，并凸显了它们在肿瘤发生最早期的协同作用，为结直肠癌的早期干预
  提供了新思路。

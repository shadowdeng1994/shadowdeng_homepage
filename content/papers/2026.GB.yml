title: A comprehensive single-cell atlas of monoallelic expression across various tissues in zebrafish
authors:
  - Hui Zeng
  - Zhan Liu
  - Huimin Xiang
  - Boliang Liu
  - Di Zhang
  - Xionglei He
  - '**Shanjun Deng**'
  - Li Liu
date: 2026-05-28
venue: '*Genome Research*'
corresponding:
  - Li Liu
  - Shanjun Deng
co_first:
  - Hui Zeng
  - Zhan Liu
abstract: |
  本文结合遗传距离较远的斑马鱼品系正反交、全基因组测序与单细胞 RNA 测序，在 50,819 个
  细胞、37 种细胞类型中构建了等位基因表达图谱，鉴定出 738 个单等位表达（MAE）基因，
  揭示 MAE 在脊椎动物发育中广泛而动态，并参与组织特化与调控多样性。
tags:

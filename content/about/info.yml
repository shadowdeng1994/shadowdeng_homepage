bio: |
  邓善俊，男，1994 年生于广东佛山，现任中山大学生命科学学院副教授、博士生导师。
  2015 年本科毕业于中国农业大学生物科学（理科实验班），2021 年于中山大学获
  生物化学与分子生物学博士学位，2022–2024 年在中山大学从事博士后研究。

  研究领域为分子进化与系统发育学，以分子层面的相似性为线索，探究生命系统在不同
  层级的演化进程，致力于推动发育生物学的计量化与理论化。主要研究兴趣包括：

  - **复杂性状的系统发育溯源**：结合比较基因组学与系统发育学，在物种树框架下解析
    睡眠、智力、神经性疾病等复杂性状的分子机制、细胞基础及其空间分布模式。
  - **细胞谱系示踪与细胞群体动态**：已在酵母、果蝇、斑马鱼中构建高分辨率的细胞
    谱系追踪系统（SMALT），未来将拓展至小鼠等哺乳动物，绘制复杂多细胞生物的
    细胞谱系图谱。
  - **发育生物学的计量化与理论化**：将物种树分析中的定量算法与理论迁移至细胞谱系
    研究，建立标准化的细胞群体计量范式，并构建“数字孪生胚胎”人工智能模型。

  近年来以第一或通讯作者在 *Nature*、*Nature Methods*、*National Science Review*
  等国际顶尖期刊发表多篇高影响力论文，并主持国家自然科学基金青年科学基金等项目。
research_interests:
  - 分子进化与系统发育学

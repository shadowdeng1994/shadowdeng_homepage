bio: |
  邓善俊，1994 年生于广东佛山，现任中山大学生命科学学院副教授、博士生导师，
  任职于贺雄雷教授团队（生命科学学院院长）。
  2015 年本科毕业于中国农业大学生物科学（理科实验班），2021 年于中山大学获
  生物化学与分子生物学博士学位，2022–2024 年在中山大学从事博士后研究。

  研究方向主要聚焦分子进化与系统发育学，以分子层面的相似性为线索，探究生命
  系统在不同层级的演化进程，致力于推动发育生物学的计量化与理论化。具体包括：

  - **细胞谱系示踪与细胞群体动态**：我们已在酵母、果蝇、斑马鱼中构建高分辨率的
    细胞谱系追踪系统（SMALT），未来将拓展至小鼠等哺乳动物，绘制复杂多细胞生物的
    细胞谱系图谱。
  - **发育生物学的计量化与理论化**：将物种树分析中的定量算法与理论迁移至细胞谱系
    研究，建立标准化的细胞群体计量范式，并构建“数字孪生胚胎”人工智能模型。
  - **复杂性状与神经相关性状的演化**：结合比较基因组学与系统发育学，在物种树框架下
    解析睡眠、智力、神经性疾病等复杂性状的分子机制、细胞基础及其空间分布模式。

  近年来，以第一或通讯作者在 *Nature*、*Nature Methods*、*National Science
  Review* 等国际顶尖期刊发表多篇高影响力论文，并主持/参与多项科技部重点研发项目、国自然重点项目、面上项目、青年科学基金等。
bio_en: |
  Shanjun Deng, born in 1994 in Foshan, Guangdong, is currently an Associate
  Professor and a doctoral supervisor at the School of Life Sciences, Sun Yat-sen
  University, in the group of Prof. Xionglei He (Dean of the School of Life
  Sciences). He received his B.S. in Biological Sciences (Science Experimental Class)
  from China Agricultural University in 2015 and his Ph.D. in Biochemistry and
  Molecular Biology from Sun Yat-sen University in 2021, and was a postdoctoral
  fellow at Sun Yat-sen University from 2022 to 2024.

  Our research mainly focuses on molecular evolution and phylogenetics, using
  molecular similarity as a clue to explore the evolutionary processes of living
  systems at different levels, with the goal of making developmental biology more
  quantitative and theoretical. Specifically:

  - **Cell lineage tracing and cell population dynamics**: we have built
    high-resolution lineage-tracing systems (SMALT) in yeast, fruit fly and
    zebrafish, and will extend them to mammals such as mouse to map the cell lineage
    of complex multicellular organisms.
  - **Quantification and theorization of developmental biology**: transferring the
    quantitative algorithms and theories of species-tree analysis to cell-lineage
    research, establishing standardized cell-population measurements and building a
    "digital-twin embryo" AI model.
  - **Evolution of complex and neural-related traits**: combining comparative
    genomics and phylogenetics to dissect the molecular mechanisms, cellular basis
    and spatial distribution of complex traits (e.g., sleep, intelligence,
    neurological disorders) within the framework of the species tree.

  In recent years, as first or corresponding author, we have published multiple
  high-impact papers in *Nature*, *Nature Methods*, *National Science Review* and
  other leading international journals, and lead or participate in multiple projects,
  including key R&D programs of the Ministry of Science and Technology and key,
  general and young-scientist projects of the National Natural Science Foundation of
  China.

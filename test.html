<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Lineage Tree</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #050a14;
    overflow: hidden;
  }
  #stage { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  const VW = 800, VH = 800;
  const CX = VW / 2, CY = VH / 2;

  let DPR = 1, SCALE = 1, OX = 0, OY = 0, CW = 0, CH = 0;

  function fit() {
    DPR = window.devicePixelRatio || 1;
    const W = window.innerWidth;
    const H = window.innerHeight;
    CW = W; CH = H;
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    SCALE = Math.min(W / VW, H / VH);
    OX = (W - VW * SCALE) / 2;
    OY = (H - VH * SCALE) / 2;
  }
  fit();
  window.addEventListener('resize', fit);

  /* 层与层之间的基础间距：
     D 决定子代之间的竖向间距（横版，保持较小 → 树矮、多显示一层）；
     Hh 决定亲代→子代的推进距离（保持较大 → 分叉更舒展、祖先更慢淡出）。 */
  const D = 80, Hh = 130, K = 1.6;
  const r0 = 42;

  /* 整棵树旋转角度：0 = 竖版（原版），90 = 横版 */
  const ROT_DEG = 90;
  const ROT = ROT_DEG * Math.PI / 180;
  const RC = Math.cos(ROT), RS = Math.sin(ROT);
  const ROT_LEFT = ROT_DEG >= 45 && ROT_DEG < 135;   // 横版时淡出方向改到左边

  /* 画面整体平移（屏幕坐标）：把树整体下移，留出上方空间放文字信息 */
  const VIEW_DX = 60, VIEW_DY = 70;

  /* 折线生长分量的切分比例：K : 1，使相邻两代分段衔接等长、每个细胞居中 */
  const BRANCH = K / (1 + K);

  const ZOOM_STEPS = 10;              // 一个循环内连续分裂（放大）的次数
  const GENERATIONS = ZOOM_STEPS + 2; // 细胞代数（多留 2 代垫底）

  /* ================================================================
     配色：沿用本站深蓝底 + 黑色 logo 的谱系彩虹
     （蓝 → 青 → 绿 → 金 → 红 → 紫，首尾相接成环）
     ================================================================ */
  const TAU = Math.PI * 2;
  const RAMP = [
    [ 63, 142, 247],  // 蓝   #3f8ef7
    [ 95, 176, 255],  // 亮蓝 #5fb0ff
    [ 63, 192, 224],  // 青   #3fc0e0
    [ 34, 184, 102],  // 绿   #22b866
    [242, 173,  52],  // 金   #f2ad34
    [239,  91,  91],  // 红   #ef5b5b
    [200, 168, 255],  // 紫   #c8a8ff
    [ 63, 142, 247],  // 回到蓝（闭环）
  ];
  function ramp(t) {
    t = ((t % 1) + 1) % 1;
    const x = t * (RAMP.length - 1), i = Math.floor(x), f = x - i;
    const a = RAMP[i], b = RAMP[i + 1];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  function mixc(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }

  const CELLS = [];
  const LINES = [];
  const BIRTH = {};
  const IDX = {};

  function hashId(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  /* 细胞性状随机种子：只取决于“角色 + 代数 mod ZOOM_STEPS”，
     于是第 g 代与第 g+10 代（循环首尾对应）形状完全一致 */
  function roleRnd(role, gen) {
    const m = ((gen % ZOOM_STEPS) + ZOOM_STEPS) % ZOOM_STEPS;
    return hashId(role + ':' + m);
  }
  function addCell(id, wx, wy, r, gen, rnd) {
    const c = { id, wx, wy, r, gen, rnd: rnd === undefined ? hashId(id) : rnd };
    CELLS.push(c);
    IDX[id] = c;
    return c;
  }

  /* 树形：主链（脊柱）每代向左上一个子细胞；另一侧各生出一个子细胞，
     该子细胞只再分裂一次、长出两片叶子（后代不再分裂）。
     由自相似性，镜头沿主链推进 ZOOM_STEPS 代后画面回到起点。
     为了让循环首尾严格一致，向“祖先”方向也补 ANCESTORS 代 ——
     否则结尾会多出一支（聚焦细胞的同胞枝），而开头没有对应，造成首尾闪烁。
     第 g 代父节点的子节点位移 (±D, -Hh) / K^g，半径 r0 / K^(g+1)。 */
  const ANCESTORS = 7;
  const GEN_MIN = -ANCESTORS;

  const spineS  = g => (Math.pow(K, -g) - 1) * K / (K - 1);  // spine_g = (D,Hh)*S(g)
  const spineId = g => 'S' + g;

  for (let g = GEN_MIN; g <= GENERATIONS; g++) {
    const s = spineS(g);
    addCell(spineId(g), D * s, Hh * s, r0 * Math.pow(K, -g), g, roleRnd('s', g));
    if (g >= 3) BIRTH[spineId(g)] = spineId(g - 1);   // 主链细胞也逐代长大，不能一开始就全出现
  }

  function birth(id, gen, parId) { if (gen >= 3) BIRTH[id] = parId; }

  for (let g = GEN_MIN; g <= GENERATIONS - 1; g++) {
    const sp = IDX[spineId(g)];
    const dx = D / Math.pow(K, g);
    const dy = Hh / Math.pow(K, g);
    const r  = r0 / Math.pow(K, g + 1);

    // 左子：下一代主链（细胞已在上面创建）
    LINES.push([sp.id, spineId(g + 1)]);

    // 右子：只分裂一次，长出两片叶子
    const right = addCell('R' + g, sp.wx + dx, sp.wy - dy, r, g + 1, roleRnd('r', g + 1));
    LINES.push([sp.id, right.id]);
    birth(right.id, g + 1, sp.id);

    if (g + 2 <= GENERATIONS) {
      const dx2 = dx / K, dy2 = dy / K, r2 = r / K;
      const l1 = addCell('R' + g + 'a', right.wx - dx2, right.wy - dy2, r2, g + 2, roleRnd('a', g + 2));
      const l2 = addCell('R' + g + 'b', right.wx + dx2, right.wy - dy2, r2, g + 2, roleRnd('b', g + 2));
      LINES.push([right.id, l1.id], [right.id, l2.id]);
      birth(l1.id, g + 2, right.id);
      birth(l2.id, g + 2, right.id);
    }
  }

  /* 每个细胞按“代数”取彩虹色；周期取 ZOOM_STEPS，
     这样循环点 t=1 与 t=0 的颜色也一致，整圈无缝。 */
  for (const c of CELLS) {
    const g = ((c.gen % ZOOM_STEPS) + ZOOM_STEPS) % ZOOM_STEPS;
    c.col = ramp(g / ZOOM_STEPS);
  }

  /* ---------------- DNA 序列 ----------------
     每轮在上一代序列基础上突变一个碱基（子代把新突变高亮），
     10 轮（= ZOOM_STEPS）后正好回到原始序列，与循环周期一致 → 无缝。 */
  const SPINE = {};
  for (let g = GEN_MIN; g <= GENERATIONS; g++) SPINE[g] = IDX[spineId(g)];

  const DNA_ROOT = ['A', 'T', 'C', 'G', 'A', 'T', 'C', 'G'];
  const MUT_POS  = [3, 0, 1, 2, 4, 3, 0, 1, 2, 4];                    // 第 1..10 代新突变的位置
  const MUT_BASE = ['C', 'T', 'A', 'G', 'T', 'G', 'A', 'T', 'C', 'A']; // 突变后的碱基
  const DNA = [DNA_ROOT.slice()];
  for (let g = 1; g <= ZOOM_STEPS; g++) {
    const next = DNA[g - 1].slice();
    next[MUT_POS[g - 1]] = MUT_BASE[g - 1];
    DNA.push(next);
  }

  /* 姊妹细胞（右子）的条形码：在亲代序列上另加一个不同的突变，
     与新产生的子代（主链细胞）不同；其叶子（后代）不再展示条形码。 */
  const NEXT_BASE = { A: 'T', T: 'G', G: 'C', C: 'A' };
  const SIB_POS = MUT_POS.map(p => (p + 3) % DNA_ROOT.length);
  const SIB_DNA = DNA.slice(0, ZOOM_STEPS).map((seq, k) => {
    const s = seq.slice();
    s[SIB_POS[k]] = NEXT_BASE[s[SIB_POS[k]]];
    return s;
  });
  const SIB = {};
  for (let g = GEN_MIN; g <= GENERATIONS - 1; g++) SIB[g] = IDX['R' + g];

  const EDGE_R = 240, EDGE_B = 240, MIN_ALPHA = 0.12;
  /* 当前帧窗口在树坐标系里的边界（每帧更新），遮罩/淡出都锚定到窗口边缘，
     这样宽屏时两侧黑边区域内也能露出星空，而不是被大片遮罩压黑。 */
  let WX0 = 0, WY0 = 0, WX1 = VW, WY1 = VH;

  function alphaForXY(sx, sy) {
    const distR = (ROT_LEFT ? (sx - WX0) : (WX1 - sx)) / EDGE_R;
    const distB = (WY1 - sy) / EDGE_B;
    const d = Math.min(1, distR, distB);
    if (d >= 1) return 1;
    if (d <= 0) return MIN_ALPHA;
    const s = d * d * (3 - 2 * d);
    return MIN_ALPHA + (1 - MIN_ALPHA) * s;
  }

  /* 星星用归一化坐标，画的时候再映射到整个窗口，宽屏时两侧也铺满 */
  const STARS = [];
  for (let i = 0; i < 220; i++) {
    STARS.push({
      nx: Math.random(),
      ny: Math.random(),
      r: 0.4 + Math.random() * 1.6,
      a: 0.06 + Math.random() * 0.28,
      ph: Math.random() * TAU,
    });
  }

  const lerp = (a, b, t) => a + (b - a) * t;

  function paintCell(sx, sy, sr, alpha, col, rnd) {
    if (sr <= 0.01 || alpha <= 0.001) return;
    /* 完全在画布外的细胞直接跳过 */
    if (sx + sr < 0 || sx - sr > VW || sy + sr < 0 || sy - sr > VH) return;

    /* 太小就画个圆点，避免细节开销 */
    if (sr < 2.2) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = rgba(mixc(col, [255, 255, 255], 0.4), 0.95);
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
      return;
    }

    /* 取色：膜亮、核暗，都是调色板颜色的柔和变体 */
    const memb   = mixc(col, [255, 255, 255], 0.62);  // 细胞膜（浅）
    const cyto   = mixc(col, [255, 255, 255], 0.42);  // 细胞质
    const rimCol = mixc(col, [255, 255, 255], 0.82);  // 膜的亮边
    const nuc    = mixc(col, [26, 30, 52], 0.32);     // 细胞核（深）
    const nucHi  = mixc(col, [255, 255, 255], 0.12);  // 核高光

    /* 外发光，和暗夜背景融合 */
    if (sr < 220) {
      const gr = sr * 1.7;
      const glow = ctx.createRadialGradient(sx, sy, sr * 0.7, sx, sy, gr);
      glow.addColorStop(0, rgba(memb, 0.16 * alpha));
      glow.addColorStop(1, rgba(memb, 0));
      ctx.globalAlpha = 1;
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(sx, sy, gr, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = alpha;

    /* 细胞膜：基本是圆的，少数带轻微、不规则的自然起伏（不是规则花瓣/多边形） */
    const ruffled = (rnd % 8) === 0;
    const amp = ruffled ? 0.055 : 0.012;
    const ph  = (rnd % 7) * 1.1;
    const f1 = 3 + (rnd % 3);
    const f2 = 5 + ((rnd >> 5) % 4);
    const p1 = (rnd % 10) * 0.7;
    const p2 = ((rnd >> 3) % 10) * 0.9;
    ctx.fillStyle = rgba(memb, 0.96);
    ctx.beginPath();
    const N = 48;
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * TAU;
      const rr = sr * (1 + amp * Math.sin(a * f1 + p1) + amp * 0.6 * Math.sin(a * f2 + p2));
      const x = sx + Math.cos(a) * rr, y = sy + Math.sin(a) * rr;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = Math.max(0.5, sr * 0.02);
    ctx.strokeStyle = rgba(rimCol, 0.55);
    ctx.stroke();

    /* 细胞质内圈 */
    ctx.fillStyle = rgba(cyto, 0.85);
    ctx.beginPath(); ctx.arc(sx, sy, sr * 0.82, 0, TAU); ctx.fill();

    /* 玻璃高光（左上） */
    ctx.fillStyle = 'rgba(255, 255, 255, 0.13)';
    ctx.beginPath();
    ctx.ellipse(sx - sr * 0.30, sy - sr * 0.32, sr * 0.40, sr * 0.26, -0.6, 0, TAU);
    ctx.fill();

    /* 细胞核：偏心、比膜深；多为圆形，少数只略微拉长，边缘略带起伏 */
    const stretch = (rnd & 16) ? 0.15 : 0.0;
    const ang = ph * 0.6;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const nx = sx + sr * 0.10 * Math.cos(ph);
    const ny = sy + sr * 0.10 * Math.sin(ph);
    const nr = sr * 0.50;
    const nN = 22;
    ctx.fillStyle = rgba(nuc, 0.96);
    ctx.beginPath();
    for (let i = 0; i <= nN; i++) {
      const a = (i / nN) * TAU;
      const wob = 1 + 0.05 * Math.sin(a * 3 + ph);
      const ux = Math.cos(a) * nr * (1 + stretch) * wob;
      const uy = Math.sin(a) * nr * (1 - stretch * 0.5) * wob;
      const x = nx + ux * ca - uy * sa;
      const y = ny + ux * sa + uy * ca;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(nucHi, 0.35);
    ctx.beginPath();
    ctx.ellipse(nx - nr * 0.26, ny - nr * 0.28, nr * 0.50, nr * 0.38, ang, 0, TAU);
    ctx.fill();

    /* 斑点/囊泡（部分细胞） */
    if (rnd & 8) {
      ctx.fillStyle = rgba(nuc, 0.45);
      for (let k = 0; k < 4; k++) {
        const a = ph + k * 1.9;
        const px = sx + Math.cos(a) * sr * 0.6;
        const py = sy + Math.sin(a) * sr * 0.6;
        ctx.beginPath(); ctx.arc(px, py, Math.max(0.4, sr * 0.05), 0, TAU); ctx.fill();
      }
    }
  }

  /* 在细胞正上方画一段 DNA 条形码（跟随细胞缩放/移动、渐显、金色高亮新突变） */
  function drawBarcode(s, seq, hi) {
    const fs = Math.min(26, s.r * 0.5);
    if (fs < 0.6) return;
    if (s.x < -s.r || s.x > VW + s.r || s.y < -s.r || s.y > VH + s.r) return;
    const vis = Math.min(1, s.r / 16) * Math.max(0, Math.min(1, (240 - s.r) / 70));
    if (vis <= 0.002) return;

    ctx.font = '700 ' + fs.toFixed(1) + 'px ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    const cw = ctx.measureText('M').width;
    const lx = s.x - cw * seq.length / 2;
    const ly = s.y - s.r - 8;

    for (let i = 0; i < seq.length; i++) {
      if (i === hi) {
        ctx.globalAlpha = s.a * vis;
        ctx.fillStyle = '#f2ad34';
        ctx.shadowColor = 'rgba(242, 173, 52, 0.9)';
        ctx.shadowBlur = 12;
      } else {
        ctx.globalAlpha = 0.9 * s.a * vis;
        ctx.fillStyle = 'rgba(205, 224, 248, 0.9)';
        ctx.shadowBlur = 0;
      }
      ctx.fillText(seq[i], lx + i * cw, ly);
    }
    ctx.shadowBlur = 0;
  }

  function paintBranch(px, py, cx, cy, alpha, pcol, ccol, w) {
    if (alpha <= 0.001) return;
    ctx.globalAlpha = alpha;
    const lg = ctx.createLinearGradient(px, py, cx, cy);
    lg.addColorStop(0, rgba(pcol, 0.85));
    lg.addColorStop(1, rgba(ccol, 0.95));
    ctx.strokeStyle = lg;
    ctx.lineWidth = w;
    /* 折线随整棵树一起旋转：
       g = 生长方向（竖版向上，横版向右），l = 横向，均随 ROT 旋转。
       生长分量按 K : 1 切分（而非对半），这样相邻两代的分段长度衔接一致，
       每个细胞都大致落在横线的中间。ROT=0 时即为正交折线。 */
    const gx = RS, gy = -RC;
    const lx = RC, ly = RS;
    const vx = cx - px, vy = cy - py;
    const gd = vx * gx + vy * gy;
    const ld = vx * lx + vy * ly;
    const a  = gd * BRANCH;          // 靠近亲代的一段
    const mx = px + gx * a;
    const my = py + gy * a;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(mx, my);
    ctx.lineTo(mx + lx * ld, my + ly * ld);
    ctx.lineTo(cx, cy);
    ctx.stroke();
  }

  function drawEdgeMask() {
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    /* 淡出锚定在窗口边缘（带宽 EDGE_R / EDGE_B），只淡化“出画”的细胞，
       不再覆盖宽屏两侧的星空区域 */
    const x0 = WX0, y0 = WY0, x1 = WX1, y1 = WY1;

    if (ROT_LEFT) {
      const gradL = ctx.createLinearGradient(x0, 0, x0 + EDGE_R, 0);
      gradL.addColorStop(0, 'rgba(5, 10, 20, 0.92)');
      gradL.addColorStop(1, 'rgba(5, 10, 20, 0)');
      ctx.fillStyle = gradL;
      ctx.fillRect(x0, y0, EDGE_R, y1 - y0);
    } else {
      const gradR = ctx.createLinearGradient(x1 - EDGE_R, 0, x1, 0);
      gradR.addColorStop(0, 'rgba(5, 10, 20, 0)');
      gradR.addColorStop(1, 'rgba(5, 10, 20, 0.92)');
      ctx.fillStyle = gradR;
      ctx.fillRect(x1 - EDGE_R, y0, EDGE_R, y1 - y0);
    }

    const gradB = ctx.createLinearGradient(0, y1 - EDGE_B, 0, y1);
    gradB.addColorStop(0, 'rgba(5, 10, 20, 0)');
    gradB.addColorStop(1, 'rgba(5, 10, 20, 0.92)');
    ctx.fillStyle = gradB;
    ctx.fillRect(x0, y1 - EDGE_B, x1 - x0, EDGE_B);
  }

  /* ================================================================
     全程匀速的单循环

     t 由 performance.now() 取模得到，严格落在 [0, 1)。
     一个循环内把“放大一次”这个变换沿主链连续作用 ZOOM_STEPS 次
     （见下面 q[] 与相机累加），于是同一个循环里连续发生多次分裂。
     由于自相似几何，t=1 时的画面与 t=0 完全等价，而代码永远取不到 1，
     所以循环点永远是同一帧 → 无缝。
     ================================================================ */
  const SPLIT_MS = 5500;             // 单次分裂用时（与原来单个循环一致）
  const T = SPLIT_MS * ZOOM_STEPS;   // 整个循环时长 = 单次 × 次数
  const t0 = performance.now();

  function frame(now) {
    const elapsed = now - t0;
    /* 大循环进度，严格落在 [0, 1) */
    const t = (elapsed % T) / T;
    const p = t;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, DPR * OX, DPR * OY);

    /* 背景铺满整个窗口并随其宽高自适应，宽屏两侧也不会是纯黑 */
    const fx0 = -OX / SCALE, fy0 = -OY / SCALE;
    const fw = CW / SCALE, fh = CH / SCALE;
    const gw = Math.max(fw, fh);
    WX0 = fx0; WY0 = fy0; WX1 = fx0 + fw; WY1 = fy0 + fh;

    const bgR = gw * 0.7;
    const bg = ctx.createRadialGradient(CX, CY, bgR * 0.06, CX, CY, bgR);
    bg.addColorStop(0,    '#0c1a2e');
    bg.addColorStop(0.55, '#08111f');
    bg.addColorStop(1,    '#050a14');
    ctx.globalAlpha = 1;
    ctx.fillStyle = bg;
    ctx.fillRect(fx0, fy0, fw, fh);

    /* 深空辉光：蓝 + 紫，位置/大小随窗口自适应 */
    const gl1x = fx0 + fw * 0.8, gl1y = fy0 + fh * 0.05;
    const gl1 = ctx.createRadialGradient(gl1x, gl1y, 0, gl1x, gl1y, gw * 0.55);
    gl1.addColorStop(0, 'rgba(58, 120, 220, 0.18)');
    gl1.addColorStop(1, 'rgba(58, 120, 220, 0)');
    ctx.fillStyle = gl1;
    ctx.fillRect(fx0, fy0, fw, fh);
    const gl2x = fx0 + fw * 0.1, gl2y = fy0 + fh * 0.12;
    const gl2 = ctx.createRadialGradient(gl2x, gl2y, 0, gl2x, gl2y, gw * 0.5);
    gl2.addColorStop(0, 'rgba(90, 70, 200, 0.14)');
    gl2.addColorStop(1, 'rgba(90, 70, 200, 0)');
    ctx.fillStyle = gl2;
    ctx.fillRect(fx0, fy0, fw, fh);

    for (const st of STARS) {
      const tw = 0.55 + 0.45 * Math.sin(now * 0.0016 + st.ph);
      const x = fx0 + st.nx * fw;
      const y = fy0 + st.ny * fh;
      ctx.globalAlpha = st.a * tw;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, st.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* 把一个循环切成 ZOOM_STEPS 段：第 i 段用子进度 q[i]∈[0,1]。
       相机中心沿主链每级左移 (D,Hh)/K^i 并放大 K 倍 —— 就是把原来手写的
       单次放大变换，用循环“静态地”重复了 ZOOM_STEPS 次。 */
    const q = new Array(ZOOM_STEPS);
    for (let i = 0; i < ZOOM_STEPS; i++) {
      const v = ZOOM_STEPS * p - i;
      q[i] = v < 0 ? 0 : (v > 1 ? 1 : v);
    }
    let camX = 0, camY = 0, camS = 1;
    for (let i = 0; i < ZOOM_STEPS; i++) {
      const s = q[i];
      const kk = Math.pow(K, i);
      camX += s * (-D / kk);
      camY += s * (-Hh / kk);
      camS *= 1 + (K - 1) * s;
    }

    const state = {};
    for (const c of CELLS) {
      let wx = c.wx, wy = c.wy, wr = c.r;
      const par = BIRTH[c.id];
      if (par) {
        const pc = IDX[par];
        const bp = q[c.gen - 3];          // 第 gen 代在第 (gen-3) 段里分裂
        wx = lerp(pc.wx, c.wx, bp);
        wy = lerp(pc.wy, c.wy, bp);
        wr = c.r * bp;
      }
      let sx = CX + camS * (wx - camX);
      let sy = CY + camS * (wy - camY);
      if (ROT_DEG) {
        const dx = sx - CX, dy = sy - CY;
        sx = CX + dx * RC - dy * RS;
        sy = CY + dx * RS + dy * RC;
      }
      sx += VIEW_DX;
      sy += VIEW_DY;
      const sr = wr * camS;
      const a  = alphaForXY(sx, sy);
      state[c.id] = { x: sx, y: sy, r: sr, a };
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const [from, to] of LINES) {
      const A = state[from], B = state[to];
      if (A.r <= 0.01 || B.r <= 0.01) continue;
      if (Math.max(A.x, B.x) < 0 || Math.min(A.x, B.x) > VW) continue;
      if (Math.max(A.y, B.y) < 0 || Math.min(A.y, B.y) > VH) continue;
      const w = Math.max(1, Math.min(6, B.r * 0.17));
      paintBranch(A.x, A.y, B.x, B.y, Math.min(A.a, B.a), IDX[from].col, IDX[to].col, w);
    }

    for (const c of CELLS) {
      const s = state[c.id];
      if (s.r <= 0.01) continue;
      paintCell(s.x, s.y, s.r, s.a, c.col, c.rnd);
    }

    /* ---------------- DNA 条形码 ----------------
       每层最左侧（主链）细胞带一段 DNA；其姊妹细胞（右子）也带一段，
       但积累的突变不同；姊妹细胞的后代（叶子）不再展示条形码。
       都跟随细胞缩放/移动、渐显、金色高亮本轮新突变，10 轮循环无缝。
       注意：要画在边缘遮罩之前，才会和细胞一样被淡出、同步消失。 */
    for (let g = GEN_MIN; g <= GENERATIONS; g++) {
      const di = ((g % ZOOM_STEPS) + ZOOM_STEPS) % ZOOM_STEPS;
      /* 环状视角：第 0 代相对上一个循环最后一代也有一次突变（第 10 次） */
      drawBarcode(state[SPINE[g].id], DNA[di], MUT_POS[(di === 0 ? ZOOM_STEPS : di) - 1]);
    }
    for (let g = GEN_MIN; g <= GENERATIONS - 1; g++) {
      const di = ((g % ZOOM_STEPS) + ZOOM_STEPS) % ZOOM_STEPS;
      drawBarcode(state[SIB[g].id], SIB_DNA[di], SIB_POS[di]);
    }
    ctx.globalAlpha = 1;

    drawEdgeMask();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
